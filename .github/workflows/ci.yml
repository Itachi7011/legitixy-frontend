name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # No typecheck step: this project has no tsconfig.json and no TypeScript source files,
      # even though @types/react and @types/react-dom are present as dev dependencies.
      #
      # No test step: no test runner is configured and no `test` script exists in package.json.
      # Add one (e.g. Vitest) and a step here once tests exist.
